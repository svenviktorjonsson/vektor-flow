<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grass view demand smoke</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9fc7df;
      }

      #layer {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body data-vf-runtime-autoboot="false">
    <div id="layer"></div>
    <canvas id="vf-screen-canvas"></canvas>
    <script src="../../web/vf-ui/vf-runtime-shell.js"></script>
    <script type="module">
      import {
        createGrassMaterialFieldReference,
        createGrassRendererPacketsReference,
      } from '../../web/vf-ui/vf-grass-material-field.mjs';
      import {
        selectGrassViewDemandReference,
      } from '../../web/vf-ui/vf-grass-view-demand.mjs';

      const frameId = 'grass_view_demand_frame';
      const camera = {
        pos: [8, -10, 6],
        target: [0, 0, 0.45],
        up: [0, 0, 1],
        fov: 44,
      };
      try {
        await window.VfRuntimeShell.ensureSceneDependencies();
        const layer = document.getElementById('layer');
        const panel = window.VfFrame.mount(layer, {
          id: frameId,
          title: 'Camera-demanded procedural grass',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        panel.root.style.left = '5%';
        panel.root.style.top = '5%';
        panel.root.style.width = '90%';
        panel.root.style.height = '90%';

        const demand = selectGrassViewDemandReference({
          camera: {
            eye: camera.pos,
            target: camera.target,
            up: camera.up,
            verticalFovRadians: camera.fov * Math.PI / 180,
            viewportWidth: 1236,
            viewportHeight: 725,
          },
          planeZ: 0,
          cellBudget: 128,
          bladeBudget: 2048,
        });
        const field = createGrassMaterialFieldReference({
          generator: 'vkf.conditioned',
          version: 1,
          seed: [0x01234567, 0x89abcdef],
          domain: 'material',
          hierarchy: ['world:temperate', 'grass-field:3'],
          lod: 0,
          channel: 'surface',
        });
        const workingSet = createGrassRendererPacketsReference(field, demand);
        const xs = demand.cells.map(([x]) => x);
        const ys = demand.cells.map(([, y]) => y);
        const minimumX = Math.min(...xs) - 1;
        const maximumX = Math.max(...xs) + 2;
        const minimumY = Math.min(...ys) - 1;
        const maximumY = Math.max(...ys) + 2;
        const ground = Object.freeze({
          id: 'grass:view-demand:ground',
          type: 'field_mesh',
          vertices: new Float32Array([
            minimumX, minimumY, -0.01, 0, 0, 1, 0.16, 0.22, 0.08, 1,
            maximumX, minimumY, -0.01, 0, 0, 1, 0.16, 0.22, 0.08, 1,
            maximumX, maximumY, -0.01, 0, 0, 1, 0.16, 0.22, 0.08, 1,
            minimumX, maximumY, -0.01, 0, 0, 1, 0.16, 0.22, 0.08, 1,
          ]),
          indices: new Uint32Array([0, 1, 2, 0, 2, 3]),
          cull_backfaces: false,
          no_lighting: true,
          specular_strength: 0.01,
        });
        window.__grassViewDemandEvidence = {
          demandedCellCount: demand.cells.length,
          scannedCellCount: demand.scannedCellCount,
          detailLevel: demand.detailLevel,
          footprint: demand.footprint,
          truncated: demand.truncated,
          bladeCount: workingSet.bladeCount,
          packetCount: workingSet.packets.length,
          vertexBytes: workingSet.vertexBytes,
          indexBytes: workingSet.indexBytes,
        };
        window.VfDisplay.mountDynamicGeomFrame(frameId, () => ({
          meshes: [ground, ...workingSet.packets],
          camera,
          lights: [{
            id: 'grass_view_sun',
            kind: 'point',
            pos: [-3, -5, 9],
            target: [0, 0, 0],
            color: [1, 0.95, 0.8, 1],
            intensity: 1,
            range: 30,
          }],
          background: [0.34, 0.55, 0.72, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(frameId);
      } catch (error) {
        window.__vfLastError = String(error && error.stack || error);
      }
    </script>
  </body>
</html>
