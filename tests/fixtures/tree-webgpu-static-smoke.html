<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>deterministic static tree WebGPU demonstration</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17202a;
      }

      #layer {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body data-vf-runtime-autoboot="false">
    <div id="layer"></div>
    <canvas id="vf-screen-canvas"></canvas>
    <script src="../../web/vf-ui/vf-runtime-shell.js"></script>
    <script type="module">
      import {
        createForestPopulationReference,
        realizeForestPatchesReference,
      } from '../../web/vf-ui/vf-forest-population.mjs';
      import {
        createTreeGeometryPlannerReference,
        planTreeGeometryReference,
      } from '../../web/vf-ui/vf-tree-geometry-plan.mjs';
      import {
        createTreeMaterialFieldReference,
        realizeTreeMaterialsReference,
      } from '../../web/vf-ui/vf-tree-material-field.mjs';
      import {
        adaptTreeWorkingSetsToRetainedPacketsReference,
      } from '../../web/vf-ui/vf-tree-renderer-packets.mjs';
      import {
        adaptTreeRenderPacketToWebGpuMeshesReference,
      } from '../../web/vf-ui/vf-tree-webgpu-packets.mjs';

      const frameId = 'tree_webgpu_static_frame';
      const requestedView = new URLSearchParams(location.search).get('view') || 'full';
      const identity = Object.freeze({
        generator: 'vkf.conditioned',
        version: 1,
        seed: Object.freeze([0x1f83d9ab, 269]),
        domain: 'material',
        hierarchy: Object.freeze(['world:boreal', 'tree:webgpu-demo']),
        lod: 0,
        channel: 'population',
      });

      try {
        await window.VfRuntimeShell.ensureSceneDependencies();
        const forest = realizeForestPatchesReference(
          createForestPopulationReference(identity),
          { patches: [[0, 0]], treeBudget: 1 },
        );
        const geometry = planTreeGeometryReference(
          createTreeGeometryPlannerReference(identity),
          forest,
          { treeIndices: [0], detailLevels: [2], primitiveBudget: 2400 },
        );
        const materials = realizeTreeMaterialsReference(
          createTreeMaterialFieldReference(identity),
          forest,
          geometry,
          { materialBudget: 2400 },
        );
        const retained = adaptTreeWorkingSetsToRetainedPacketsReference(
          geometry,
          materials,
        );
        const tree = adaptTreeRenderPacketToWebGpuMeshesReference(
          retained.packets[0],
          { vertexBudget: 65536, indexBudget: 393216 },
        );
        const minimum = [Infinity, Infinity, Infinity];
        const maximum = [-Infinity, -Infinity, -Infinity];
        for (const mesh of tree.meshes) {
          for (let vertex = 0; vertex < mesh.vertices.length; vertex += 10) {
            for (let axis = 0; axis < 3; axis += 1) {
              minimum[axis] = Math.min(minimum[axis], mesh.vertices[vertex + axis]);
              maximum[axis] = Math.max(maximum[axis], mesh.vertices[vertex + axis]);
            }
          }
        }
        const center = minimum.map((value, axis) => (value + maximum[axis]) * 0.5);
        const span = Math.max(...minimum.map((value, axis) => maximum[axis] - value));
        window.__treeWebGpuStaticEvidence = {
          treeId: retained.packets[0].treeId,
          primitiveCount: retained.packets[0].primitiveCount,
          counts: tree.counts,
          vertexCount: tree.vertexCount,
          indexCount: tree.indexCount,
          sourceBytes: retained.packets[0].vectorBytes,
        };

        const layer = document.getElementById('layer');
        const panel = window.VfFrame.mount(layer, {
          id: frameId,
          title: 'Deterministic tree — bark, branches, and leaves',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        panel.root.style.left = requestedView === 'full' ? '4%' : '-400%';
        panel.root.style.top = '3%';
        panel.root.style.width = '92%';
        panel.root.style.height = '94%';

        window.VfDisplay.mountDynamicGeomFrame(frameId, () => ({
          meshes: tree.meshes,
          camera: {
            pos: [
              center[0] + span * 0.75,
              center[1] - span * 1.4,
              center[2] + span * 0.3,
            ],
            target: center,
            up: [0, 0, 1],
            fov: 42,
          },
          lights: [
            {
              id: 'tree_key',
              kind: 'point',
              pos: [center[0] - span * 0.45, center[1] - span * 0.55, maximum[2] + span * 0.35],
              target: center,
              color: [1, 0.91, 0.72, 1],
              intensity: span * span * 2.35,
              range: span * 3,
            },
            {
              id: 'tree_fill',
              kind: 'point',
              pos: [center[0] + span * 0.55, center[1] - span * 0.5, maximum[2] + span * 0.08],
              target: center,
              color: [0.62, 0.78, 0.64, 1],
              intensity: span * span * 1.45,
              range: span * 2.5,
            },
          ],
          background: [0.065, 0.105, 0.15, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(frameId);

        const junctionFrameId = 'tree_webgpu_junction_frame';
        const junction = tree.junctions.find((candidate) => (
          candidate.ports.filter((port) => port.role === 'child').length === 2
        ));
        const junctionRadius = junction.ports.find((port) => port.role === 'incoming').radius;
        const junctionPanel = window.VfFrame.mount(layer, {
          id: junctionFrameId,
          title: 'Connected branching junction close-up',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        junctionPanel.root.style.left = requestedView === 'junction' ? '4%' : '-400%';
        junctionPanel.root.style.top = '3%';
        junctionPanel.root.style.width = '92%';
        junctionPanel.root.style.height = '94%';
        window.VfDisplay.mountDynamicGeomFrame(junctionFrameId, () => ({
          meshes: tree.meshes,
          camera: {
            pos: [
              junction.point[0] + junctionRadius * 9,
              junction.point[1] - junctionRadius * 16,
              junction.point[2] + junctionRadius * 6,
            ],
            target: junction.point,
            up: [0, 0, 1],
            fov: 30,
          },
          lights: [
            {
              id: 'junction_key',
              kind: 'point',
              pos: [
                junction.point[0] - junctionRadius * 2,
                junction.point[1] - junctionRadius * 4,
                junction.point[2] + junctionRadius * 5,
              ],
              target: junction.point,
              color: [1, 0.92, 0.76, 1],
              intensity: junctionRadius * junctionRadius * 42,
              range: junctionRadius * 14,
            },
            {
              id: 'junction_fill',
              kind: 'point',
              pos: [
                junction.point[0] + junctionRadius * 4,
                junction.point[1] - junctionRadius * 3,
                junction.point[2],
              ],
              target: junction.point,
              color: [0.55, 0.72, 0.62, 1],
              intensity: junctionRadius * junctionRadius * 18,
              range: junctionRadius * 12,
            },
          ],
          background: [0.065, 0.105, 0.15, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(junctionFrameId);

        const twigFrameId = 'tree_webgpu_twig_junction_frame';
        const lateralJunctions = tree.junctions.filter((candidate) => candidate.ports.some((port) => (
          port.role === 'child'
          && retained.packets[0].primitiveIds[port.primitive].includes(':branch:shoot:')
        )));
        const twigJunction = lateralJunctions
          .map((candidate) => {
            const incomingRadius = candidate.ports.find((port) => port.role === 'incoming').radius;
            const nearest = Math.min(...tree.junctions
              .filter((other) => other !== candidate)
              .map((other) => Math.hypot(
                other.point[0] - candidate.point[0],
                other.point[1] - candidate.point[1],
                other.point[2] - candidate.point[2],
              )));
            return { candidate, clearance: nearest / incomingRadius };
          })
          .sort((left, right) => right.clearance - left.clearance)[0].candidate;
        const twigRadius = twigJunction.ports.find((port) => port.role === 'incoming').radius;
        const twigIncoming = twigJunction.ports.find((port) => port.role === 'incoming').tangent;
        const twigChild = twigJunction.ports.find((port) => (
          port.role === 'child'
          && retained.packets[0].primitiveIds[port.primitive].includes(':branch:shoot:')
        )).tangent;
        const twigViewRaw = [
          twigIncoming[1] * twigChild[2] - twigIncoming[2] * twigChild[1],
          twigIncoming[2] * twigChild[0] - twigIncoming[0] * twigChild[2],
          twigIncoming[0] * twigChild[1] - twigIncoming[1] * twigChild[0],
        ];
        const twigViewLength = Math.max(Math.hypot(...twigViewRaw), 1e-6);
        const twigView = twigViewRaw.map((value) => value / twigViewLength);
        const twigWood = tree.meshes[0];
        const twigIndices = [];
        for (let triangle = 0; triangle < twigWood.indices.length; triangle += 3) {
          const vertices = [0, 1, 2].map((corner) => twigWood.indices[triangle + corner]);
          if (vertices.every((vertex) => (
            twigWood.vertices[vertex * 10 + 2] > twigJunction.point[2] - twigRadius * 1.1
            && Math.hypot(
              twigWood.vertices[vertex * 10] - twigJunction.point[0],
              twigWood.vertices[vertex * 10 + 1] - twigJunction.point[1],
              twigWood.vertices[vertex * 10 + 2] - twigJunction.point[2],
            ) < twigRadius * 3.5
          ))) twigIndices.push(...vertices);
        }
        const isolatedTwigWood = Object.freeze({
          ...twigWood,
          indices: twigWood.indices,
          casts_shadow: false,
          receives_shadow: false,
        });
        const twigPanel = window.VfFrame.mount(layer, {
          id: twigFrameId,
          title: 'Flush twig graft close-up',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        twigPanel.root.style.left = requestedView === 'twig' ? '4%' : '-400%';
        twigPanel.root.style.top = '3%';
        twigPanel.root.style.width = '92%';
        twigPanel.root.style.height = '94%';
        window.VfDisplay.mountDynamicGeomFrame(twigFrameId, () => ({
          meshes: [isolatedTwigWood],
          camera: {
            pos: [
              twigJunction.point[0] + twigView[0] * twigRadius * 15,
              twigJunction.point[1] + twigView[1] * twigRadius * 15,
              twigJunction.point[2] + twigView[2] * twigRadius * 15,
            ],
            target: twigJunction.point,
            up: twigIncoming,
            fov: 34,
          },
          lights: [
            { id: 'twig_key', kind: 'point',
              pos: [twigJunction.point[0] - twigRadius * 3, twigJunction.point[1] - twigRadius * 5,
                twigJunction.point[2] + twigRadius * 5],
              target: twigJunction.point, color: [1, 0.95, 0.82, 1],
              intensity: twigRadius * twigRadius * 520, range: twigRadius * 16 },
            { id: 'twig_fill', kind: 'point',
              pos: [twigJunction.point[0] + twigRadius * 4, twigJunction.point[1] - twigRadius * 2,
                twigJunction.point[2] - twigRadius],
              target: twigJunction.point, color: [0.72, 0.82, 0.72, 1],
              intensity: twigRadius * twigRadius * 260, range: twigRadius * 14 },
          ],
          background: [0.065, 0.105, 0.15, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(twigFrameId);

        const barkFrameId = 'tree_webgpu_bark_neutral_frame';
        const trunkCurve = retained.packets[0].curves[0];
        const barkPoint = trunkCurve.points[Math.floor(trunkCurve.points.length * 0.55)];
        const barkRadius = retained.packets[0].transforms[7];
        const barkPanel = window.VfFrame.mount(layer, {
          id: barkFrameId,
          title: 'Neutral-light procedural bark proof',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        barkPanel.root.style.left = requestedView === 'bark' ? '4%' : '-400%';
        barkPanel.root.style.top = '3%';
        barkPanel.root.style.width = '92%';
        barkPanel.root.style.height = '94%';
        const neutralWood = Object.freeze({ ...tree.meshes[0], casts_shadow: false, receives_shadow: false });
        window.VfDisplay.mountDynamicGeomFrame(barkFrameId, () => ({
          meshes: [neutralWood],
          camera: {
            pos: [barkPoint[0] + barkRadius * 7, barkPoint[1] - barkRadius * 10, barkPoint[2]],
            target: barkPoint,
            up: [0, 0, 1],
            fov: 25,
          },
          lights: [
            { id: 'bark_even_left', kind: 'point',
              pos: [barkPoint[0] - barkRadius * 5, barkPoint[1] - barkRadius * 6, barkPoint[2] + barkRadius * 3],
              target: barkPoint, color: [1, 1, 1, 1], intensity: barkRadius * barkRadius * 180,
              range: barkRadius * 18 },
            { id: 'bark_even_right', kind: 'point',
              pos: [barkPoint[0] + barkRadius * 5, barkPoint[1] - barkRadius * 6, barkPoint[2] - barkRadius * 3],
              target: barkPoint, color: [1, 1, 1, 1], intensity: barkRadius * barkRadius * 48,
              range: barkRadius * 18 },
          ],
          background: [0.12, 0.12, 0.12, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(barkFrameId);
      } catch (error) {
        window.__vfLastError = String(error && error.stack || error);
      }
    </script>
  </body>
</html>
