<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>deterministic static tree WebGPU demonstration</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17202a;
      }

      #layer {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body data-vf-runtime-autoboot="false">
    <div id="layer"></div>
    <canvas id="vf-screen-canvas"></canvas>
    <script src="../../web/vf-ui/vf-runtime-shell.js"></script>
    <script type="module">
      import {
        createForestPopulationReference,
        realizeForestPatchesReference,
      } from '../../web/vf-ui/vf-forest-population.mjs';
      import {
        createTreeGeometryPlannerReference,
        planTreeGeometryReference,
      } from '../../web/vf-ui/vf-tree-geometry-plan.mjs';
      import {
        createTreeMaterialFieldReference,
        realizeTreeMaterialsReference,
      } from '../../web/vf-ui/vf-tree-material-field.mjs';
      import {
        adaptTreeWorkingSetsToRetainedPacketsReference,
      } from '../../web/vf-ui/vf-tree-renderer-packets.mjs';
      import {
        adaptTreeRenderPacketToWebGpuMeshesReference,
      } from '../../web/vf-ui/vf-tree-webgpu-packets.mjs';

      const frameId = 'tree_webgpu_static_frame';
      const identity = Object.freeze({
        generator: 'vkf.conditioned',
        version: 1,
        seed: Object.freeze([0x1f83d9ab, 269]),
        domain: 'material',
        hierarchy: Object.freeze(['world:boreal', 'tree:webgpu-demo']),
        lod: 0,
        channel: 'population',
      });

      try {
        await window.VfRuntimeShell.ensureSceneDependencies();
        const forest = realizeForestPatchesReference(
          createForestPopulationReference(identity),
          { patches: [[0, 0]], treeBudget: 1 },
        );
        const geometry = planTreeGeometryReference(
          createTreeGeometryPlannerReference(identity),
          forest,
          { treeIndices: [0], detailLevels: [2], primitiveBudget: 64 },
        );
        const materials = realizeTreeMaterialsReference(
          createTreeMaterialFieldReference(identity),
          forest,
          geometry,
          { materialBudget: 64 },
        );
        const retained = adaptTreeWorkingSetsToRetainedPacketsReference(
          geometry,
          materials,
        );
        const tree = adaptTreeRenderPacketToWebGpuMeshesReference(
          retained.packets[0],
          { vertexBudget: 4096, indexBudget: 16384 },
        );
        const x = forest.positions[0];
        const y = forest.positions[1];
        const height = forest.growth[1];
        const crownRadius = forest.growth[2];
        window.__treeWebGpuStaticEvidence = {
          treeId: retained.packets[0].treeId,
          primitiveCount: retained.packets[0].primitiveCount,
          counts: tree.counts,
          vertexCount: tree.vertexCount,
          indexCount: tree.indexCount,
          sourceBytes: retained.packets[0].vectorBytes,
        };

        const layer = document.getElementById('layer');
        const panel = window.VfFrame.mount(layer, {
          id: frameId,
          title: 'Deterministic tree — bark, branches, and leaves',
          draggable: false,
          dockable: false,
          resizable: false,
          closable: false,
        });
        panel.root.style.left = '4%';
        panel.root.style.top = '3%';
        panel.root.style.width = '92%';
        panel.root.style.height = '94%';

        window.VfDisplay.mountDynamicGeomFrame(frameId, () => ({
          meshes: tree.meshes,
          camera: {
            pos: [
              x + height * 0.9,
              y - height * 1.55,
              height * 0.65,
            ],
            target: [x, y, height * 0.52],
            up: [0, 0, 1],
            fov: 42,
          },
          lights: [
            {
              id: 'tree_key',
              kind: 'point',
              pos: [x - height * 0.35, y - height * 0.45, height * 1.25],
              target: [x, y, height * 0.55],
              color: [1, 0.91, 0.72, 1],
              intensity: height * height * 0.7,
              range: height * 3,
            },
            {
              id: 'tree_fill',
              kind: 'point',
              pos: [x + height * 0.4, y + height * 0.25, height * 0.72],
              target: [x, y, height * 0.55],
              color: [0.45, 0.62, 0.5, 1],
              intensity: height * height * 0.2,
              range: height * 2.5,
            },
          ],
          background: [0.12, 0.20, 0.28, 1],
          unified_renderer: true,
        }));
        window.VfDisplay.requestDynamicGeomFrameUpdate(frameId);
      } catch (error) {
        window.__vfLastError = String(error && error.stack || error);
      }
    </script>
  </body>
</html>
