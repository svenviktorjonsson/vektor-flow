<!doctype html>
<meta charset="utf-8">
<title>wood-polarization-gpu-running</title>
<script type="module">
  import {
    createForestPopulationReference,
    realizeForestPatchesReference,
  } from "../../web/vf-ui/vf-forest-population.mjs";
  import {
    createTreeGeometryPlannerReference,
    planTreeGeometryReference,
  } from "../../web/vf-ui/vf-tree-geometry-plan.mjs";
  import {
    createWoodGrowthCoordinateFieldReference,
    realizeWoodGrowthCoordinatesReference,
  } from "../../web/vf-ui/vf-wood-growth-coordinates.mjs";
  import {
    createWoodVolumeFieldReference,
  } from "../../web/vf-ui/vf-wood-volume-field.mjs";
  import {
    lowerProceduralWoodSpectralRendererReference,
  } from "../../web/vf-ui/vf-procedural-wood-spectral-lowering.mjs";
  import {
    packWoodCutPlaneGridReference,
  } from "../../web/vf-ui/vf-wood-cut-plane-grid.mjs";
  import {
    packWoodCutSurfacePacketReference,
  } from "../../web/vf-ui/vf-wood-cut-surface-packet.mjs";
  import {
    packWoodCutMaterialPacketReference,
  } from "../../web/vf-ui/vf-wood-cut-material-packet.mjs";
  import {
    evaluateWoodCutPolarizedSampleReference,
  } from "../../web/vf-ui/vf-wood-polarization-sample.mjs";
  import {
    createWoodPolarizationGpuConsumptionFixture,
    createWoodPolarizationGpuDescriptorReference,
    verifyWoodPolarizationGpuConsumption,
  } from "../../web/vf-ui/vf-wood-polarization-gpu.mjs";
  import {
    createWoodSpectralPresentationGpuConsumptionFixture,
    verifyWoodSpectralPresentationGpuConsumption,
  } from "../../web/vf-ui/vf-wood-spectral-presentation-gpu.mjs";
  import {
    createWoodSpectralRendererDrawPipelineReference,
  } from "../../web/vf-ui/vf-wood-spectral-renderer-pipeline.mjs";
  import {
    createProceduralMaterialSceneFrameSchedulerReference,
  } from "../../web/vf-ui/vf-procedural-material-scene-frame.mjs";
  import {
    captureProceduralMaterialSceneFrameReference,
  } from "../../web/vf-ui/vf-procedural-material-scene-capture.mjs";
  import {
    createProceduralWoodSpectralSceneFixtureReference,
  } from "../../web/vf-ui/vf-procedural-wood-spectral-scene.mjs";
  import {
    reflectGgxPolarized,
  } from "../helpers/vf-rough-polarization-reference.mjs";

  const identity = {
    generator: "vkf.conditioned",
    version: 1,
    seed: [0x1f83d9ab, 0x5be0cd19],
    domain: "material",
    hierarchy: ["world:boreal", "forest:north-slope"],
    lod: 0,
    channel: "population",
  };
  const opticalConstants = {
    wavelengthsNm: [450, 550, 650, 850],
    n: [1.4, 1.6, 1.9, 2.2],
    k: [0.05, 0.2, 0.55, 0.9],
  };

  function generatedMaterial() {
    const forest = realizeForestPatchesReference(
      createForestPopulationReference(identity),
      { patches: [[-2, 3]], treeBudget: 32 },
    );
    const geometry = planTreeGeometryReference(
      createTreeGeometryPlannerReference(identity),
      forest,
      {
        treeIndices: [0],
        detailLevels: [2],
        primitiveBudget: 64,
      },
    );
    const coordinates = realizeWoodGrowthCoordinatesReference(
      createWoodGrowthCoordinateFieldReference(),
      geometry,
      { segmentBudget: 64 },
    );
    const trunk = coordinates.segments[0];
    const center = trunk.origin.map((origin, component) => (
      origin + trunk.axis[component] * trunk.length * 0.42
    ));
    const grid = packWoodCutPlaneGridReference({
      field: createWoodVolumeFieldReference(identity),
      coordinates,
      segmentIndex: 0,
      center,
      axisU: trunk.radialU,
      axisV: trunk.radialV,
      width: trunk.radius * 1.2,
      height: trunk.radius * 1.2,
      columns: 3,
      rows: 3,
      detailLevel: 2,
      footprint: 0,
      sampleBudget: 9,
    });
    return packWoodCutMaterialPacketReference(
      packWoodCutSurfacePacketReference(grid, "end-grain"),
    );
  }

  async function renderProceduralWoodSpectralScene(device, fixture) {
    const shader = device.createShaderModule({
      label: "VKF procedural wood spectral scene",
      code: fixture.source,
    });
    if (typeof shader.getCompilationInfo === "function") {
      const info = await shader.getCompilationInfo();
      const errors = info.messages.filter((message) => (
        message.type === "error"
      ));
      if (errors.length > 0) {
        throw new Error(`scene shader: ${errors.map((error) => (
          `${error.lineNum}:${error.linePos}:${error.message}`
        )).join("\n")}`);
      }
    }
    const pipeline = await device.createRenderPipelineAsync({
      label: "VKF procedural wood spectral scene",
      layout: "auto",
      vertex: {
        module: shader,
        entryPoint: "vf_procedural_wood_vertex",
        buffers: [{
          arrayStride: fixture.vertexStrideBytes,
          attributes: [
            {
              shaderLocation: 0,
              offset: 0,
              format: "float32x2",
            },
            {
              shaderLocation: 1,
              offset: 8,
              format: "float32x3",
            },
            {
              shaderLocation: 2,
              offset: 20,
              format: "float32x3",
            },
            {
              shaderLocation: 3,
              offset: 32,
              format: "float32x2",
            },
          ],
        }],
      },
      fragment: {
        module: shader,
        entryPoint: "vf_procedural_wood_fragment",
        targets: [{ format: fixture.format }],
      },
      primitive: { topology: "triangle-list" },
    });
    const vertexBuffer = device.createBuffer({
      size: fixture.vertices.byteLength,
      usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    });
    const indexBuffer = device.createBuffer({
      size: fixture.indices.byteLength,
      usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
    });
    const colorBuffer = device.createBuffer({
      size: fixture.fragmentUniforms.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const texture = device.createTexture({
      size: [fixture.width, fixture.height, 1],
      format: fixture.format,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    const readback = device.createBuffer({
      size: fixture.outputByteLength,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    try {
      device.queue.writeBuffer(vertexBuffer, 0, fixture.vertices);
      device.queue.writeBuffer(indexBuffer, 0, fixture.indices);
      device.queue.writeBuffer(
        colorBuffer,
        0,
        fixture.fragmentUniforms,
      );
      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: colorBuffer } }],
      });
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: texture.createView(),
          clearValue: { r: 0.01, g: 0.015, b: 0.02, a: 1.0 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.setVertexBuffer(0, vertexBuffer);
      pass.setIndexBuffer(indexBuffer, "uint32");
      pass.drawIndexed(fixture.indices.length);
      pass.end();
      encoder.copyTextureToBuffer(
        { texture },
        {
          buffer: readback,
          bytesPerRow: fixture.bytesPerRow,
          rowsPerImage: fixture.height,
        },
        {
          width: fixture.width,
          height: fixture.height,
          depthOrArrayLayers: 1,
        },
      );
      device.queue.submit([encoder.finish()]);
      await readback.mapAsync(GPUMapMode.READ);
      const padded = new Uint8Array(readback.getMappedRange().slice(0));
      readback.unmap();
      const rgba8 = new Uint8Array(fixture.width * fixture.height * 4);
      for (let row = 0; row < fixture.height; row += 1) {
        rgba8.set(
          padded.subarray(
            row * fixture.bytesPerRow,
            row * fixture.bytesPerRow + fixture.width * 4,
          ),
          row * fixture.width * 4,
        );
      }
      let renderedPixels = 0;
      const foregroundColors = new Set();
      for (let pixel = 0; pixel < rgba8.length; pixel += 4) {
        if (rgba8[pixel] > 64) {
          renderedPixels += 1;
          foregroundColors.add(
            `${rgba8[pixel]}:${rgba8[pixel + 1]}:${rgba8[pixel + 2]}`,
          );
        }
      }
      return {
        rgba8,
        renderedPixels,
        foregroundColorCount: foregroundColors.size,
      };
    } finally {
      vertexBuffer.destroy();
      indexBuffer.destroy();
      colorBuffer.destroy();
      texture.destroy();
      readback.destroy();
    }
  }

  async function consumeSpectralPresentation(
    device,
    rendererPacket,
    fixture,
  ) {
    const shader = device.createShaderModule({
      label: "VKF wood spectral presentation parity",
      code: fixture.source,
    });
    if (typeof shader.getCompilationInfo === "function") {
      const info = await shader.getCompilationInfo();
      const errors = info.messages.filter((message) => (
        message.type === "error"
      ));
      if (errors.length > 0) {
        throw new Error(errors.map((error) => error.message).join("\n"));
      }
    }
    const pipeline = await device.createComputePipelineAsync({
      label: "VKF wood spectral presentation parity",
      layout: "auto",
      compute: {
        module: shader,
        entryPoint: "vf_wood_spectral_present",
      },
    });
    const output = device.createBuffer({
      size: fixture.expected.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
    });
    const readback = device.createBuffer({
      size: fixture.expected.byteLength,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    const drawPipeline = createWoodSpectralRendererDrawPipelineReference(
      device,
      {
        resourceBudget: 1,
        packetBudget: 1,
      },
    );
    const sceneScheduler =
      createProceduralMaterialSceneFrameSchedulerReference({
        drawPipeline,
        frameBudget: 2,
        scheduleFrame: requestAnimationFrame,
      });
    let actual;
    let releasedFrame;
    let reusedBinding = false;
    const sceneFrames = [];
    const submit = async (draw) => {
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, draw.bindGroup);
      pass.dispatchWorkgroups(1);
      pass.end();
      device.queue.submit([encoder.finish()]);
      await device.queue.onSubmittedWorkDone();
      return {
        bindGroup: draw.bindGroup,
        reusedBinding: draw.reusedBinding,
      };
    };
    try {
      const firstFrame = await sceneScheduler.requestFrame({
        packet: rendererPacket,
        pipeline,
        outputBuffer: output,
        submit,
      });
      const secondFrame = await sceneScheduler.requestFrame({
        packet: rendererPacket,
        pipeline,
        outputBuffer: output,
        submit,
      });
      releasedFrame = secondFrame;
      sceneFrames.push(firstFrame.frame, secondFrame.frame);
      reusedBinding = firstFrame.output.bindGroup
          === secondFrame.output.bindGroup
        && secondFrame.output.reusedBinding;
      if (!reusedBinding) {
        throw new Error("spectral draw binding was not retained");
      }
      const copyEncoder = device.createCommandEncoder();
      copyEncoder.copyBufferToBuffer(
        output,
        0,
        readback,
        0,
        fixture.expected.byteLength,
      );
      device.queue.submit([copyEncoder.finish()]);
      await readback.mapAsync(GPUMapMode.READ);
      actual = new Float32Array(readback.getMappedRange().slice(0));
      readback.unmap();
    } finally {
      sceneScheduler.destroy();
      output.destroy();
      readback.destroy();
    }
    return {
      actual,
      lifetime: sceneScheduler.snapshot(),
      releasedFrame,
      reusedBinding,
      sceneFrames,
    };
  }

  async function run() {
    if (!navigator.gpu) {
      return { outcome: "unavailable", detail: "navigator.gpu missing" };
    }
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: "high-performance",
    });
    if (!adapter) {
      return {
        outcome: "unavailable",
        detail: "WebGPU adapter unavailable",
      };
    }
    const device = await adapter.requestDevice();
    const material = generatedMaterial();
    const sample = evaluateWoodCutPolarizedSampleReference(material, {
      sampleIndex: 4,
      wavelengthsNm: [450, 600, 850],
      wavelengthBudget: 3,
      opticalConstants,
      incidentStokes: [1, 1, 0, 0],
      nIncident: 1,
      geometricCosThetaIncident: 0.65,
      microfacetSampleCount: 128,
      polarizationTransport: reflectGgxPolarized,
    });
    const descriptor = createWoodPolarizationGpuDescriptorReference(
      sample,
      { spectralSampleBudget: 3 },
    );
    const fixture = createWoodPolarizationGpuConsumptionFixture(descriptor);
    if (fixture.violations !== 0) {
      throw new Error(`${fixture.violations} physical input violations`);
    }
    const shader = device.createShaderModule({
      label: "VKF wood polarization consumption parity",
      code: fixture.source,
    });
    if (typeof shader.getCompilationInfo === "function") {
      const info = await shader.getCompilationInfo();
      const errors = info.messages.filter((message) => (
        message.type === "error"
      ));
      if (errors.length > 0) {
        throw new Error(errors.map((error) => error.message).join("\n"));
      }
    }
    const pipeline = await device.createComputePipelineAsync({
      label: "VKF wood polarization consumption parity",
      layout: "auto",
      compute: {
        module: shader,
        entryPoint: "vf_wood_polarization_consume",
      },
    });
    const input = device.createBuffer({
      size: fixture.inputFloats.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    const output = device.createBuffer({
      size: fixture.expected.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
    });
    const readback = device.createBuffer({
      size: fixture.expected.byteLength,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    try {
      device.queue.writeBuffer(input, 0, fixture.inputFloats);
      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: input } },
          { binding: 1, resource: { buffer: output } },
        ],
      });
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.dispatchWorkgroups(Math.ceil(
        descriptor.spectralSampleCount / 64,
      ));
      pass.end();
      encoder.copyBufferToBuffer(
        output,
        0,
        readback,
        0,
        fixture.expected.byteLength,
      );
      device.queue.submit([encoder.finish()]);
      await readback.mapAsync(GPUMapMode.READ);
      const actual = new Float32Array(
        readback.getMappedRange().slice(0),
      );
      readback.unmap();
      const parity = verifyWoodPolarizationGpuConsumption(
        fixture,
        actual,
      );
      if (!parity.matched) {
        throw new Error(JSON.stringify(parity));
      }
      const lowering = lowerProceduralWoodSpectralRendererReference(
        material,
        {
          polarization: descriptor,
          polarizationGpuOutput: actual,
          exposureStops: 1.0,
          triangleBudget: 8,
        },
      );
      const {
        visible,
        presentation,
        descriptor: bundled,
        rendererPacket,
      } = lowering;
      const bundledFixture =
        createWoodSpectralPresentationGpuConsumptionFixture(
          rendererPacket.wood_spectral_presentation_gpu,
        );
      const bundledRun = await consumeSpectralPresentation(
        device,
        rendererPacket,
        bundledFixture,
      );
      const bundledParity = verifyWoodSpectralPresentationGpuConsumption(
        bundledFixture,
        bundledRun.actual,
      );
      if (!bundledParity.matched) {
        throw new Error(JSON.stringify(bundledParity));
      }
      const sceneFixture =
        createProceduralWoodSpectralSceneFixtureReference(
          lowering,
          { width: 64, height: 64 },
        );
      const sceneImage = await renderProceduralWoodSpectralScene(
        device,
        sceneFixture,
      );
      if (
        sceneImage.renderedPixels <= 0
        || sceneImage.renderedPixels >= sceneFixture.width * sceneFixture.height
        || sceneImage.foregroundColorCount <= 1
      ) {
        throw new Error("procedural wood scene field was not spatially varied");
      }
      const captureOptions = {
        width: sceneFixture.width,
        height: sceneFixture.height,
        rgba8: sceneImage.rgba8,
      };
      const firstCapture =
        await captureProceduralMaterialSceneFrameReference(
          bundledRun.releasedFrame,
          presentation,
          captureOptions,
        );
      const repeatCapture =
        await captureProceduralMaterialSceneFrameReference(
          bundledRun.releasedFrame,
          presentation,
          captureOptions,
        );
      if (firstCapture.sha256 !== repeatCapture.sha256) {
        throw new Error("procedural material capture was not repeatable");
      }
      return {
        outcome: "pass",
        detail: `${parity.records} spectral records matched`,
        records: parity.records,
        maxAbsoluteError: parity.maxAbsoluteError,
        roughness: descriptor.floats[3],
        infraredRgb: Array.from(actual.slice(16, 19)),
        linearRgb: visible.color.linearRgb,
        linearHdrRgb: presentation.linearHdrRgb,
        displayLinearRgb: presentation.displayLinearRgb,
        reflectedInfraredRadianceIntegral:
          visible.reflectedInfraredRadianceIntegral,
        maxSampleEnergyError: visible.maxSampleEnergyError,
        bundledBytes: bundled.byteLength,
        bundledMaxAbsoluteError: bundledParity.maxAbsoluteError,
        rendererLoweringKind: lowering.kind,
        rendererTriangleCount: rendererPacket.triangleCount,
        rendererGpuLifetime: bundledRun.lifetime,
        rendererBindingReused: bundledRun.reusedBinding,
        rendererSceneFrames: bundledRun.sceneFrames,
        rendererCapture: {
          kind: firstCapture.kind,
          mimeType: firstCapture.mimeType,
          width: firstCapture.width,
          height: firstCapture.height,
          byteLength: firstCapture.byteLength,
          sha256: firstCapture.sha256,
          repeatSha256: repeatCapture.sha256,
          linearHdrRgb: firstCapture.linearHdrRgb,
          displayLinearRgb: firstCapture.displayLinearRgb,
          exposureStops: firstCapture.exposureStops,
          renderedPixels: sceneImage.renderedPixels,
          foregroundColorCount: sceneImage.foregroundColorCount,
        },
      };
    } finally {
      input.destroy();
      output.destroy();
      readback.destroy();
    }
  }

  let result;
  try {
    result = await run();
  } catch (error) {
    result = {
      outcome: "fail",
      detail: String(error?.message || error),
    };
  }
  document.title = `wood-polarization-gpu-${result.outcome}`;
  window.__woodPolarizationGpuEvidence = result;
</script>
