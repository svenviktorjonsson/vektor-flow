<!doctype html>
<meta charset="utf-8">
<title>road-renderer-webgpu-running</title>
<script type="module">
  import {
    createRoadRendererDrawPipelineReference,
  } from '../../web/vf-ui/vf-road-renderer-pipeline.mjs';
  import {
    ROAD_RENDERER_WGSL,
    createRoadRendererSubmitReference,
  } from '../../web/vf-ui/vf-road-renderer-submit.mjs';

  const WIDTH = 8;
  const HEIGHT = 8;
  const BYTES_PER_ROW = 256;

  function hex(bytes) {
    return Array.from(bytes, (byte) => (
      byte.toString(16).padStart(2, '0')
    )).join('');
  }

  async function digest(bytes) {
    return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)));
  }

  function roadPacket() {
    const albedo = new Float32Array([64 / 255, 128 / 255, 192 / 255]);
    return Object.freeze({
      type: 'field_mesh',
      id: 'road:cell:headless',
      vertices: new Float32Array([
        -1, -1, 0, 0, 0, 1, ...albedo, 1,
         1, -1, 0, 0, 0, 1, ...albedo, 1,
         1,  1, 0, 0, 0, 1, ...albedo, 1,
        -1,  1, 0, 0, 0, 1, ...albedo, 1,
      ]),
      indices: new Uint32Array([0, 1, 2, 0, 2, 3]),
      specular_strength: 0.25,
      material_channels: Object.freeze({
        albedo,
        roughness: new Float32Array([0.75]),
        wetness: new Float32Array([0.2]),
        wearDisplacement: new Float32Array([-0.001]),
      }),
    });
  }

  async function run() {
    if (!navigator.gpu) {
      return { outcome: 'unavailable', detail: 'navigator.gpu missing' };
    }
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: 'high-performance',
    });
    if (!adapter) {
      return { outcome: 'unavailable', detail: 'WebGPU adapter unavailable' };
    }
    const device = await adapter.requestDevice();
    const shader = device.createShaderModule({
      label: 'VKF retained road renderer',
      code: ROAD_RENDERER_WGSL,
    });
    if (typeof shader.getCompilationInfo === 'function') {
      const info = await shader.getCompilationInfo();
      const errors = info.messages.filter((message) => message.type === 'error');
      if (errors.length > 0) {
        throw new Error(errors.map((error) => error.message).join('\n'));
      }
    }
    const pipeline = await device.createRenderPipelineAsync({
      label: 'VKF retained road renderer',
      layout: 'auto',
      vertex: {
        module: shader,
        entryPoint: 'road_vertex',
        buffers: [{
          arrayStride: 40,
          attributes: [{
            shaderLocation: 0,
            offset: 0,
            format: 'float32x3',
          }],
        }],
      },
      fragment: {
        module: shader,
        entryPoint: 'road_fragment',
        targets: [{ format: 'rgba8unorm' }],
      },
      primitive: { topology: 'triangle-list' },
    });
    const colorAttachment = device.createTexture({
      label: 'VKF retained road output',
      size: [WIDTH, HEIGHT],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    const readback = device.createBuffer({
      label: 'VKF retained road readback',
      size: BYTES_PER_ROW * HEIGHT,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    const drawPipeline = createRoadRendererDrawPipelineReference(device, {
      packetBudget: 1,
    });
    try {
      const packet = roadPacket();
      const draw = drawPipeline.draw({
        frame: 0,
        packet: Object.freeze({
          kind: 'procedural-road-renderer-packet:v1',
          packets: Object.freeze([packet]),
          delta: Object.freeze({
            upsert: Object.freeze([packet]),
            remove: Object.freeze([]),
            unchanged: Object.freeze([]),
          }),
        }),
      });
      const submit = createRoadRendererSubmitReference(device, {
        pipeline,
        colorAttachment,
        width: WIDTH,
        height: HEIGHT,
        async readPixels() {
          const encoder = device.createCommandEncoder();
          encoder.copyTextureToBuffer(
            { texture: colorAttachment },
            {
              buffer: readback,
              bytesPerRow: BYTES_PER_ROW,
              rowsPerImage: HEIGHT,
            },
            [WIDTH, HEIGHT],
          );
          device.queue.submit([encoder.finish()]);
          await readback.mapAsync(GPUMapMode.READ);
          const padded = new Uint8Array(readback.getMappedRange());
          const compact = new Uint8Array(WIDTH * HEIGHT * 4);
          for (let row = 0; row < HEIGHT; row += 1) {
            compact.set(
              padded.subarray(row * BYTES_PER_ROW, row * BYTES_PER_ROW + WIDTH * 4),
              row * WIDTH * 4,
            );
          }
          readback.unmap();
          return compact;
        },
      });
      const output = await submit(draw);
      const expected = [64, 128, 192, 255];
      for (let offset = 0; offset < output.rgba8.length; offset += 4) {
        for (let channel = 0; channel < 4; channel += 1) {
          if (output.rgba8[offset + channel] !== expected[channel]) {
            throw new Error(
              `pixel ${offset / 4} channel ${channel}: `
              + `${output.rgba8[offset + channel]} != ${expected[channel]}`,
            );
          }
        }
      }
      return {
        outcome: 'pass',
        width: WIDTH,
        height: HEIGHT,
        pixels: WIDTH * HEIGHT,
        draws: output.drawCount,
        sha256: await digest(output.rgba8),
        uploadedBytes: drawPipeline.snapshot().uploadedBytes,
      };
    } finally {
      drawPipeline.destroy();
      readback.destroy();
      colorAttachment.destroy();
    }
  }

  let result;
  try {
    result = await run();
  } catch (error) {
    result = { outcome: 'fail', detail: String(error?.message || error) };
  }
  document.title = `road-renderer-webgpu-${result.outcome}`;
  window.__roadRendererWebGpuEvidence = result;
</script>
