name: Compiler CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-native-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install C++17 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ cmake ninja-build

      - name: Build strict native compiler
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Test native VKF language and standard library
        run: build/native-compiler/bin/vkf-strict -t tests/vkf

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify generated symbolic kernel
        run: npm run check:symbolic-kernel

      - name: Test browser package
        run: npm test

      - name: Test published package archive
        run: npm run test:package
