name: Native Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VKF_RELEASE_VERSION: "0.2.0"
  VKF_PROOF_SUFFIX: "020"
  ZIG_VERSION: "0.16.0"
  ZIG_LINUX_X64_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        shell: pwsh
        run: choco install llvm nsis --yes --no-progress

      - name: Build Python-free compiler
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict")

      - name: Run full native VKF release suite
        shell: pwsh
        run: .\build\native-compiler-clang\bin\vkf-strict.exe -t tests/vkf

      - name: Verify complete optimizer policy landscape
        shell: pwsh
        run: >-
          node benchmarks/policy-landscape/run.mjs
          --compiler=build/native-compiler-clang/bin/vkf-strict.exe
          --runs=200
          --output=benchmarks/policy-landscape/evidence/windows-x64-v0.2.0-ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-policy-landscape-proof
          path: |
            benchmarks/policy-landscape/evidence/windows-x64-v0.2.0-ci.json
            benchmarks/policy-landscape/evidence/windows-x64-v0.2.0-ci.md
            benchmarks/policy-landscape/evidence/windows-x64-v0.2.0-ci.svg
          if-no-files-found: error

      - name: Verify every documented program 10 times
        shell: pwsh
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler-clang/bin/vkf-strict.exe
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=windows-x64-${{ env.VKF_PROOF_SUFFIX }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-readme-proof
          path: |
            benchmarks/readme-examples/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}.json
            benchmarks/readme-examples/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}.md
          if-no-files-found: error

      - name: Package portable release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "$env:VKF_RELEASE_VERSION-dev" }
          .\scripts\package-native-release.ps1 -Version $version

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "$env:VKF_RELEASE_VERSION-dev" }
          .\scripts\build-windows-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/releases/vektor-flow-windows-x64.zip
            dist/releases/vektor-flow-windows-x64.zip.sha256
            dist/releases/vektor-flow-windows-x64-setup.exe
            dist/releases/vektor-flow-windows-x64-setup.exe.sha256
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Build Python-free compiler
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Run full native VKF release suite
        run: build/native-compiler/bin/vkf-strict -t tests/vkf

      - name: Verify every documented program 10 times
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler/bin/vkf-strict
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=linux-x64-${{ env.VKF_PROOF_SUFFIX }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-readme-proof
          path: |
            benchmarks/readme-examples/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}.json
            benchmarks/readme-examples/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}.md
          if-no-files-found: error

      - name: Package native release
        run: |
          chmod +x scripts/package-native-release.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=${VKF_RELEASE_VERSION}-dev; fi
          scripts/package-native-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            dist/releases/vektor-flow-linux-x64.tar.gz
            dist/releases/vektor-flow-linux-x64.tar.gz.sha256
            dist/releases/vektor-flow-linux-x64.deb
            dist/releases/vektor-flow-linux-x64.deb.sha256
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build strict native compiler
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Run full native VKF release suite
        run: build/native-compiler/bin/vkf-strict -t tests/vkf

      - name: Verify every documented program 10 times
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler/bin/vkf-strict
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=macos-arm64-${{ env.VKF_PROOF_SUFFIX }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-readme-proof
          path: |
            benchmarks/readme-examples/results/macos-arm64-${{ env.VKF_PROOF_SUFFIX }}.json
            benchmarks/readme-examples/results/macos-arm64-${{ env.VKF_PROOF_SUFFIX }}.md
          if-no-files-found: error

      - name: Package archive and installer
        run: |
          chmod +x scripts/package-native-release-macos.sh packaging/macos/install.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=${VKF_RELEASE_VERSION}-dev; fi
          scripts/package-native-release-macos.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            dist/releases/vektor-flow-macos-arm64.tar.gz
            dist/releases/vektor-flow-macos-arm64.tar.gz.sha256
            dist/releases/vektor-flow-macos-arm64.pkg
            dist/releases/vektor-flow-macos-arm64.pkg.sha256
          if-no-files-found: error

  comparison-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang cmake ninja-build xz-utils
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          zig_archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/${ZIG_VERSION}/${zig_archive}" \
            --output "/tmp/${zig_archive}"
          echo "${ZIG_LINUX_X64_SHA256}  /tmp/${zig_archive}" | sha256sum --check --strict
          tar --extract --file "/tmp/${zig_archive}" --directory /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Run controlled large-kernel comparison
        run: >-
          node benchmarks/core-comparison/run.mjs
          --case=spectral-norm-large,fannkuch-redux-large,n-body-large
          --language=vkf,c,rust,zig
          --compile-runs=100
          --compile-warmups=1
          --runs=1000
          --warmups=50
          --process-runs=10
          --process-warmups=1
          --enforce-relative-gate=true
          --output=linux-x64-${{ env.VKF_PROOF_SUFFIX }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-language-comparison-proof
          path: |
            benchmarks/core-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}.json
            benchmarks/core-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}.md
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64, macos-arm64, comparison-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-release"
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file docs/releases/0.2.0.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --notes-file docs/releases/0.2.0.md
          fi
