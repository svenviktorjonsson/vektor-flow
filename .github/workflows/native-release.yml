name: Native Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VKF_RELEASE_VERSION: "0.3.0"
  VKF_PROOF_SUFFIX: "030"
  ZIG_VERSION: "0.16.0"
  ZIG_LINUX_X64_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        shell: pwsh
        run: choco install llvm nsis --yes --no-progress

      - name: Build Python-free compiler and WASM emitter
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict", "vkf_symbolic_kernel_artifact", "vkf_linalg_factor_x64_test")

      - name: Verify embedded x64 linalg kernels
        shell: pwsh
        run: |
          .\build\native-compiler-clang\bin\vkf_linalg_factor_x64_test.exe
          .\build\native-compiler-clang\bin\vkf-strict.exe -t tests/platform/windows

      - name: Run full native VKF release suite
        shell: pwsh
        run: |
          .\build\native-compiler-clang\bin\vkf-strict.exe -t tests/vkf
          .\build\native-compiler-clang\bin\vkf-strict.exe -t tests/stdlib

      - name: Verify linalg, physics, and symbolic native-WASM parity
        run: node tools/verify-stdlib-wasm.mjs

      - name: Package portable release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "$env:VKF_RELEASE_VERSION-dev" }
          .\scripts\package-native-release.ps1 -Version $version

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "$env:VKF_RELEASE_VERSION-dev" }
          .\scripts\build-windows-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/releases/vektor-flow-windows-x64.zip
            dist/releases/vektor-flow-windows-x64.zip.sha256
            dist/releases/vektor-flow-windows-x64-setup.exe
            dist/releases/vektor-flow-windows-x64-setup.exe.sha256
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Build Python-free compiler and WASM emitter
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict vkf_symbolic_kernel_artifact

      - name: Run full native VKF release suite
        run: |
          build/native-compiler/bin/vkf-strict -t tests/vkf
          build/native-compiler/bin/vkf-strict -t tests/stdlib

      - name: Verify linalg, physics, and symbolic native-WASM parity
        run: VKF_NATIVE_BIN=build/native-compiler/bin node tools/verify-stdlib-wasm.mjs

      - name: Package native release
        run: |
          chmod +x scripts/package-native-release.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=${VKF_RELEASE_VERSION}-dev; fi
          scripts/package-native-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            dist/releases/vektor-flow-linux-x64.tar.gz
            dist/releases/vektor-flow-linux-x64.tar.gz.sha256
            dist/releases/vektor-flow-linux-x64.deb
            dist/releases/vektor-flow-linux-x64.deb.sha256
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build strict native compiler and WASM emitter
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict vkf_symbolic_kernel_artifact

      - name: Run full native VKF release suite
        run: |
          build/native-compiler/bin/vkf-strict -t tests/vkf
          build/native-compiler/bin/vkf-strict -t tests/stdlib

      - name: Verify linalg, physics, and symbolic native-WASM parity
        run: VKF_NATIVE_BIN=build/native-compiler/bin node tools/verify-stdlib-wasm.mjs

      - name: Package archive and installer
        run: |
          chmod +x scripts/package-native-release-macos.sh packaging/macos/install.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=${VKF_RELEASE_VERSION}-dev; fi
          scripts/package-native-release-macos.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            dist/releases/vektor-flow-macos-arm64.tar.gz
            dist/releases/vektor-flow-macos-arm64.tar.gz.sha256
            dist/releases/vektor-flow-macos-arm64.pkg
            dist/releases/vektor-flow-macos-arm64.pkg.sha256
          if-no-files-found: error

  linalg-windows-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native benchmark tools
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Build verified compiler revision
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict")

      - name: Build pinned linear-algebra competitors
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r benchmarks/linalg-comparison/requirements.txt
          cmake -S benchmarks/linalg-comparison/competitors/eigen -B .work/linalg-eigen -DCMAKE_BUILD_TYPE=Release
          cmake --build .work/linalg-eigen --config Release --parallel 2
          cargo build --release --manifest-path benchmarks/linalg-comparison/competitors/faer/Cargo.toml
          node benchmarks/linalg-comparison/build-vkf-runners.mjs --compiler=build/native-compiler-clang/bin/vkf-strict.exe --output=.work/linalg-vkf-release

      - name: Enforce linear-algebra comparison gate
        shell: pwsh
        run: >-
          node benchmarks/linalg-comparison/run.mjs
          --languages=vkf,eigen,faer,scipy
          --runs=100
          --threads=1
          --vkf-manifest=.work/linalg-vkf-release/manifest.json
          --eigen=.work/linalg-eigen/Release/vkf-linalg-eigen.exe
          --faer=benchmarks/linalg-comparison/competitors/faer/target/release/vkf-linalg-faer-runner.exe
          --python=python
          --relative-limit=1.5
          --output=benchmarks/linalg-comparison/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-linalg-comparison-proof
          path: |
            benchmarks/linalg-comparison/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/linalg-comparison/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  policy-windows-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native compiler tools
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Build verified compiler revision
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict")

      - name: Verify complete optimizer policy landscape
        shell: pwsh
        run: >-
          node benchmarks/policy-landscape/run.mjs
          --compiler=build/native-compiler-clang/bin/vkf-strict.exe
          --runs=200
          --output=benchmarks/policy-landscape/evidence/windows-x64-v0.3.0-ci-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-policy-landscape-proof
          path: |
            benchmarks/policy-landscape/evidence/windows-x64-v0.3.0-ci-${{ github.run_id }}.json
            benchmarks/policy-landscape/evidence/windows-x64-v0.3.0-ci-${{ github.run_id }}.md
            benchmarks/policy-landscape/evidence/windows-x64-v0.3.0-ci-${{ github.run_id }}.svg
          if-no-files-found: error

  examples-windows-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native compiler tools
        shell: pwsh
        run: choco install llvm --yes --no-progress

      - name: Build verified compiler revision
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict")

      - name: Verify every documented program 10 times
        shell: pwsh
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler-clang/bin/vkf-strict.exe
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-readme-proof
          path: |
            benchmarks/readme-examples/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/readme-examples/results/windows-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  examples-macos-arm64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build verified compiler revision
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Verify every documented program 10 times
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler/bin/vkf-strict
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=macos-arm64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-readme-proof
          path: |
            benchmarks/readme-examples/results/macos-arm64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/readme-examples/results/macos-arm64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  examples-linux-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Build verified compiler revision
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Verify every documented program 10 times
        run: >-
          node benchmarks/readme-examples/run.mjs
          --compiler=build/native-compiler/bin/vkf-strict
          --compile-runs=10
          --compile-warmups=0
          --runs=10
          --warmups=0
          --output=linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-readme-proof
          path: |
            benchmarks/readme-examples/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/readme-examples/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  core-linux-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential clang cmake ninja-build xz-utils
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          zig_archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl --fail --location --silent --show-error \
            "https://ziglang.org/download/${ZIG_VERSION}/${zig_archive}" \
            --output "/tmp/${zig_archive}"
          echo "${ZIG_LINUX_X64_SHA256}  /tmp/${zig_archive}" | sha256sum --check --strict
          tar --extract --file "/tmp/${zig_archive}" --directory /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build verified compiler revision
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Run controlled large-kernel comparison
        run: >-
          node benchmarks/core-comparison/run.mjs
          --case=spectral-norm-large,fannkuch-redux-large,n-body-large
          --language=vkf,c,rust,zig
          --compile-runs=100
          --compile-warmups=1
          --runs=1000
          --warmups=50
          --process-runs=10
          --process-warmups=1
          --enforce-relative-gate=true
          --relative-limit=1.5
          --output=linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-language-comparison-proof
          path: |
            benchmarks/core-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/core-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  symbolic-comparison-linux-x64:
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"

      - name: Install pinned symbolic comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build curl git
          python -m pip install --disable-pip-version-check -r benchmarks/symbolic-comparison/requirements.txt
          julia --project=benchmarks/symbolic-comparison/julia --startup-file=no \
            -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

          boost_archive=/tmp/boost_1_86_0.tar.bz2
          curl --fail --location --silent --show-error \
            https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2 \
            --output "$boost_archive"
          echo "1bed88e40401b2cb7a1f76d4bab499e352fa4d0c5f31c0dbae64e24d34d7513b  $boost_archive" \
            | sha256sum --check --strict
          tar --extract --bzip2 --file "$boost_archive" --directory /tmp

          mkdir -p .work
          git init .work/symengine
          git -C .work/symengine remote add origin https://github.com/symengine/symengine.git
          git -C .work/symengine fetch --depth 1 origin 0c183629a35dd9d8123fafcc47b0e0283bbae80d
          git -C .work/symengine checkout --detach FETCH_HEAD
          cmake -S .work/symengine -B .work/symengine-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINTEGER_CLASS=boostmp \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBoost_DIR="$GITHUB_WORKSPACE/benchmarks/symbolic-comparison/cmake" \
            -DBOOST_ROOT=/tmp/boost_1_86_0
          cmake --build .work/symengine-build --parallel 2
          cmake -S benchmarks/symbolic-comparison/competitors -B .work/symengine-runner -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSymEngine_DIR="$GITHUB_WORKSPACE/.work/symengine-build" \
            -DBoost_DIR="$GITHUB_WORKSPACE/benchmarks/symbolic-comparison/cmake" \
            -DBOOST_ROOT=/tmp/boost_1_86_0
          cmake --build .work/symengine-runner --parallel 2

      - name: Build verified compiler revision
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Enforce symbolic comparison gate
        run: >-
          node benchmarks/symbolic-comparison/run.mjs
          --compiler=build/native-compiler/bin/vkf-strict
          --languages=vkf,symengine,sympy,symbolics
          --symengine=.work/symengine-runner/symengine_runner
          --python=python
          --julia=julia
          --julia-project=benchmarks/symbolic-comparison/julia
          --runs=10
          --timeout-ms=30000
          --relative-limit=1.5
          --output=benchmarks/symbolic-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-symbolic-comparison-proof
          path: |
            benchmarks/symbolic-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.json
            benchmarks/symbolic-comparison/results/linux-x64-${{ env.VKF_PROOF_SUFFIX }}-${{ github.run_id }}.md
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-x64
      - linux-x64
      - macos-arm64
      - linalg-windows-x64
      - policy-windows-x64
      - examples-windows-x64
      - examples-macos-arm64
      - examples-linux-x64
      - core-linux-x64
      - symbolic-comparison-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-release"
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "docs/releases/${VKF_RELEASE_VERSION}.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --notes-file "docs/releases/${VKF_RELEASE_VERSION}.md"
          fi
