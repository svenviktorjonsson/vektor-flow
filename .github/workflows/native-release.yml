name: Native Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        shell: pwsh
        run: choco install llvm nsis --yes --no-progress

      - name: Build Python-free compiler
        shell: pwsh
        run: .\scripts\build-native-compiler.ps1 -OnlyTargets @("vkf-strict")

      - name: Prove 20k compile and runtime budgets
        shell: pwsh
        run: >-
          node benchmarks/core-comparison/run.mjs
          --case=scalar-control-small
          --language=vkf
          --compile-runs=100
          --compile-warmups=1
          --runs=100
          --warmups=5
          --output=windows-x64-20k

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-performance-proof
          path: |
            benchmarks/core-comparison/results/windows-x64-20k.json
            benchmarks/core-comparison/results/windows-x64-20k.md
          if-no-files-found: error

      - name: Package portable release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0-dev" }
          .\scripts\package-native-release.ps1 -Version $version

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0-dev" }
          .\scripts\build-windows-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/releases/vektor-flow-windows-x64.zip
            dist/releases/vektor-flow-windows-x64.zip.sha256
            dist/releases/vektor-flow-windows-x64-setup.exe
            dist/releases/vektor-flow-windows-x64-setup.exe.sha256
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake ninja-build

      - name: Build Python-free compiler
        run: |
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Prove 20k compile and runtime budgets
        run: >-
          node benchmarks/core-comparison/run.mjs
          --case=scalar-control-small
          --language=vkf
          --compile-runs=100
          --compile-warmups=1
          --runs=100
          --warmups=5
          --output=linux-x64-20k

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-performance-proof
          path: |
            benchmarks/core-comparison/results/linux-x64-20k.json
            benchmarks/core-comparison/results/linux-x64-20k.md
          if-no-files-found: error

      - name: Package native release
        run: |
          chmod +x scripts/package-native-release.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.1.0-dev; fi
          scripts/package-native-release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            dist/releases/vektor-flow-linux-x64.tar.gz
            dist/releases/vektor-flow-linux-x64.tar.gz.sha256
            dist/releases/vektor-flow-linux-x64.deb
            dist/releases/vektor-flow-linux-x64.deb.sha256
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build strict native compiler
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S compiler/native -B build/native-compiler -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-compiler --parallel 2 --target vkf_strict

      - name: Prove 20k compile and runtime budgets
        run: >-
          node benchmarks/core-comparison/run.mjs
          --case=scalar-control-small
          --language=vkf
          --compile-runs=100
          --compile-warmups=1
          --runs=100
          --warmups=5
          --output=macos-arm64-20k

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-performance-proof
          path: |
            benchmarks/core-comparison/results/macos-arm64-20k.json
            benchmarks/core-comparison/results/macos-arm64-20k.md
          if-no-files-found: error

      - name: Package archive and installer
        run: |
          chmod +x scripts/package-native-release-macos.sh packaging/macos/install.sh
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.1.0-dev; fi
          scripts/package-native-release-macos.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            dist/releases/vektor-flow-macos-arm64.tar.gz
            dist/releases/vektor-flow-macos-arm64.tar.gz.sha256
            dist/releases/vektor-flow-macos-arm64.pkg
            dist/releases/vektor-flow-macos-arm64.pkg.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
